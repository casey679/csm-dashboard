<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="This Week">
<link rel="manifest" href="manifest.json">
<title>This Week</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --paper:#F4F1EC; --card:#FBFAF7; --ink:#0B0B0B; --orange:#E8602C;
    --muted:#6E6A63; --line:#D8D3C9;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --body:'Inter',system-ui,sans-serif;
    --disp:'Archivo Black',Impact,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:28px 20px 60px}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .word{font-family:var(--disp);font-size:15px;letter-spacing:.02em}
  .eyebrow{font-family:var(--mono);font-size:10.5px;color:var(--orange);letter-spacing:.12em;text-transform:lowercase;display:flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  h1{font-family:var(--disp);font-size:clamp(28px,7vw,38px);line-height:1;letter-spacing:-.5px;text-transform:lowercase;margin:10px 0 2px}
  .range{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:26px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 14px 12px}
  .stat .label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:lowercase;margin-bottom:6px}
  .stat .num{font-family:var(--disp);font-size:24px;line-height:1}
  .stat .sub{font-family:var(--mono);font-size:11px;color:var(--orange);margin-top:5px}
  .stat.wide{grid-column:1 / -1}
  .payments{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:4px;padding:16px;margin-bottom:22px}
  .payments .label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:lowercase;margin-bottom:6px}
  .payments .amount{font-family:var(--disp);font-size:30px}
  .payments .note{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px}
  .section-label{font-family:var(--mono);font-size:10.5px;color:var(--orange);letter-spacing:.12em;text-transform:lowercase;margin:26px 0 10px}
  .blockers{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:4px;padding:4px 0}
  .blocker-item{padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--line)}
  .blocker-item:last-child{border-bottom:none}
  .empty{padding:16px;font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:center}
  .footer{margin-top:34px;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="word">CSM</div>
    <div class="eyebrow" id="liveBadge"><span class="dot"></span>live</div>
  </div>
  <h1>this week</h1>
  <div class="range" id="dateRange">—</div>

  <div class="grid">
    <div class="stat">
      <div class="label">ig followers</div>
      <div class="num" id="igCount">—</div>
    </div>
    <div class="stat">
      <div class="label">content posted</div>
      <div class="num" id="contentCount">—</div>
    </div>
    <div class="stat">
      <div class="label">calls booked</div>
      <div class="num" id="salesCount">—</div>
    </div>
    <div class="stat">
      <div class="label">next event</div>
      <div class="num" id="eventDays">—</div>
      <div class="sub" id="eventName">—</div>
    </div>
    <div class="stat wide">
      <div class="label">youtube</div>
      <div class="num" id="youtubeSubs" style="display:inline">—</div>
      <span class="sub" id="youtubeVideos" style="display:inline;margin-left:8px">—</span>
    </div>
  </div>

  <div class="payments">
    <div class="label">payment wins this week</div>
    <div class="amount" id="paymentTotal">—</div>
    <div class="note" id="paymentNote">—</div>
  </div>

  <div class="section-label">waiting on you</div>
  <div class="blockers" id="blockersList"><div class="empty">loading…</div></div>

  <div class="footer" id="lastUpdated">—</div>
</div>

<script>
async function loadDashboard(){
  try{
    const res = await fetch('data/dashboard-data.json?_=' + Date.now());
    const data = await res.json();
    document.getElementById('dateRange').textContent = data.dateRange || '—';
    document.getElementById('igCount').textContent = data.igCount || '—';
    document.getElementById('contentCount').textContent = data.contentCount || '—';
    document.getElementById('salesCount').textContent = data.salesCount || '—';
    document.getElementById('eventDays').textContent = data.eventDays || '—';
    document.getElementById('eventName').textContent = data.eventName || '—';
    document.getElementById('youtubeSubs').textContent = (data.youtubeSubs || '—') + ' subs';
    document.getElementById('youtubeVideos').textContent = (data.youtubeVideos || '—') + ' videos';
    document.getElementById('paymentTotal').textContent = data.paymentTotal || '—';
    document.getElementById('paymentNote').textContent = data.paymentNote || '';
    document.getElementById('lastUpdated').textContent = 'updated ' + (data.lastUpdated || '—');
  }catch(e){
    console.error('Failed to load dashboard data', e);
  }
}

async function loadBlockers(){
  try{
    const res = await fetch('data/blockers.json?_=' + Date.now());
    const data = await res.json();
    const list = document.getElementById('blockersList');
    list.innerHTML = '';
    if(!data.blockers || data.blockers.length === 0){
      list.innerHTML = '<div class="empty">nothing waiting on you</div>';
      return;
    }
    data.blockers.forEach(text => {
      const row = document.createElement('div');
      row.className = 'blocker-item';
      row.textContent = text;
      list.appendChild(row);
    });
  }catch(e){
    console.error('Failed to load blockers', e);
  }
}

function refreshAll(){
  loadDashboard();
  loadBlockers();
}

refreshAll();
setInterval(refreshAll, 60000);
</script>
</body>
</html>
